<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1515" />
    <title>speedboat</title>
    <link rel="icon" type="image/png" href="/assets/branding/favicon.png" />
    <link rel="preload" href="/assets/fonts/speedboat/SairaStencilOne-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- §T.178 COI shim: crossOriginIsolated on GitHub Pages (no-op where headers already isolate).
         BEFORE the module script: it may reload the page once. -->
    <script src="./coi-register.js"></script>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #151b1c;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #app canvas {
        display: block;
      }
      @font-face {
        font-family: "SB Saira Stencil";
        src: url('/assets/fonts/speedboat/SairaStencilOne-Regular.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        overflow-y: auto;
        padding: clamp(24px, 5vh, 64px) clamp(24px, 6vw, 96px);
        color: #e5ece9;
        background: #0c1515;
        opacity: 1;
        visibility: visible;
        transition: opacity 650ms ease, visibility 650ms step-end;
      }
      #boot-splash.boot-splash--ready {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-splash__content {
        width: min(86vw, 1000px);
        text-align: center;
      }
      .boot-splash__wordmark { position: relative; isolation: isolate; }
      .boot-splash__title {
        margin: 0;
        padding-bottom: 0.12em;
        font: 400 clamp(2.75rem, 17.5vw, 12.75rem)/0.95 "SB Saira Stencil", sans-serif;
        letter-spacing: -0.045em;
      }
      .boot-splash__water {
        position: absolute;
        inset: 51% 0 0;
        width: 100%;
        height: 49%;
        fill: #31585d;
        opacity: 0.78;
        pointer-events: none;
      }
      .boot-splash__loading { width: min(15rem, 65%); margin: clamp(32px, 7vh, 64px) auto 0; }
      .boot-splash__kicker {
        margin: 0 0 1rem;
        color: #f28b50;
        font: 400 0.7rem/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .boot-splash__loader {
        --boot-progress: 0.06;
        height: 2px;
        background: #29403f;
      }
      .boot-splash__loader::before {
        content: '';
        display: block;
        height: 100%;
        background: #f28b50;
        transform: scaleX(var(--boot-progress));
        transform-origin: left center;
        transition: transform 700ms cubic-bezier(0.22, 0.7, 0.2, 1);
      }
      @media (max-height: 460px) {
        .boot-splash__title { font-size: min(17.5vw, 32vh); }
        .boot-splash__loading { margin-top: 24px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash, .boot-splash__loader::before { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Loading speedboat">
      <div class="boot-splash__content">
        <div class="boot-splash__wordmark">
          <h1 class="boot-splash__title">speedboat</h1>
          <svg class="boot-splash__water" viewBox="0 0 1200 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
            <path d="M0 14 C25 1 50 1 75 14 S125 27 150 14 S200 1 225 14 S275 27 300 14 S350 1 375 14 S425 27 450 14 S500 1 525 14 S575 27 600 14 S650 1 675 14 S725 27 750 14 S800 1 825 14 S875 27 900 14 S950 1 975 14 S1025 27 1050 14 S1100 1 1125 14 S1175 27 1200 14 V100 H0 Z" />
          </svg>
        </div>
        <div class="boot-splash__loading">
          <p class="boot-splash__kicker">Tuning in</p>
          <div class="boot-splash__loader" role="progressbar" aria-label="Loading speedboat" aria-valuemin="0" aria-valuemax="100" aria-valuenow="6"></div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const splash = document.getElementById('boot-splash');
        if (!splash) throw new Error('missing boot splash root');
        const loader = splash.querySelector('.boot-splash__loader');
        const kicker = splash.querySelector('.boot-splash__kicker');
        let done = false;
        const dismiss = () => {
          if (done) return;
          done = true;
          if (loader) loader.style.setProperty('--boot-progress', '1');
          splash.classList.add('boot-splash--ready');
          splash.addEventListener('transitionend', () => splash.remove(), { once: true });
          setTimeout(() => splash.remove(), 2000);
        };
        // main-speedboat.ts calls this after the first presented frame, as main-raft.ts does
        window.__bootReady = dismiss;
        const LABELS = {
          renderer: ['Waking the device', 0.12],
          'scene build': ['Raising the sea', 0.3],
          'boat models': ['Rolling out the hulls', 0.45],
          'npc physics': ['Calling the fleet', 0.55],
          'shader compile': ['Reading the water', 0.72],
          'first frame': ['On the grid', 0.9],
        };
        window.__bootProgress = (phase) => {
          const l = LABELS[phase];
          if (!l) return;
          if (kicker) kicker.textContent = l[0];
          if (loader) {
            loader.style.setProperty('--boot-progress', String(l[1]));
            loader.setAttribute('aria-valuenow', String(Math.round(l[1] * 100)));
          }
        };
        // failsafe — never trap the user behind the splash
        setTimeout(dismiss, 30000);
      })();
    </script>
    <script type="module" src="/src/main-speedboat.ts"></script>
  </body>
</html>
