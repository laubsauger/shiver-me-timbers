<!doctype html>
<title>Retained wake orientation GPU regression</title>
<pre id="report">Running WebGPU accumulation checks…</pre>
<script type="module">
import * as THREE from 'three/webgpu';
import { uniform } from 'three/tsl';
import { createAccumulation } from '/src/flowfoam/accumulation.ts';
import { createFlowNoiseUniforms } from '/src/flowfoam/flowNoise.ts';
import { flowFoamParams } from '/src/params/flowfoam.ts';

// Actual production accumulation kernels, small deterministic source. No ocean,
// particles or animation loop: this checks packing, clocks, saturation and scroll.
const renderer = new THREE.WebGPURenderer();
await renderer.init();
const p = { ...flowFoamParams, blurSpread: 0 };
const source = uniform(new THREE.Vector4(1, 2, 0.6, 0.8));
const acc = createAccumulation(p, createFlowNoiseUniforms(p), undefined, {
  res: 32, size: () => 32, decayHalfLife: () => 5, wakeScale: () => 1,
  useFlow: false, useCapture: false, useDetail: false, carryOrientation: true,
  simFoam: () => source,
});
const results = [];
async function read() {
  const device = renderer.backend.device;
  const buffer = device.createBuffer({ size: 32 * 32 * 16, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const encoder = device.createCommandEncoder();
  encoder.copyTextureToBuffer(
    { texture: renderer.backend.get(acc.foamTexture).texture },
    { buffer, bytesPerRow: 32 * 16, rowsPerImage: 32 }, { width: 32, height: 32 },
  );
  device.queue.submit([encoder.finish()]);
  await buffer.mapAsync(GPUMapMode.READ);
  const copy = new Float32Array(buffer.getMappedRange().slice(0));
  buffer.unmap(); buffer.destroy();
  return copy;
}
function check(label, actual, expected, tolerance = 2e-5) {
  const pass = Number.isFinite(actual) && Math.abs(actual - expected) <= tolerance;
  results.push({ label, actual, expected, pass });
  if (!pass) throw new Error(`${label}: ${actual}, expected ${expected}`);
}
const middle = (16 * 32 + 16) * 4;
try {
  acc.step(renderer, 1 / 60);
  let pixels = await read();
  check('source x uses foam duration', pixels[middle + 2] / pixels[middle], 0.6);
  check('source z uses foam duration', pixels[middle + 3] / pixels[middle], 0.8);
  for (let i = 0; i < 90; i++) acc.step(renderer, 1 / 60);
  pixels = await read();
  check('coverage saturates', pixels[middle], 1);
  check('saturated moment remains premultiplied', Math.hypot(pixels[middle + 2], pixels[middle + 3]), 1);
  source.value.set(0, 0, 0, 0);
  for (let i = 0; i < 60; i++) acc.step(renderer, 1 / 60);
  acc.setCenter(4, 0);
  acc.step(renderer, 0);
  pixels = await read();
  check('decay and scroll preserve x axis', pixels[middle + 2] / pixels[middle], 0.6);
  check('decay and scroll preserve z axis', pixels[middle + 3] / pixels[middle], 0.8);
  const exposed = (16 * 32 + 31) * 4;
  check('new region has no inherited coverage', pixels[exposed], 0);
  check('new region has no inherited direction', Math.hypot(pixels[exposed + 2], pixels[exposed + 3]), 0);
  window.result = { pass: true, results };
} catch (error) {
  window.result = { pass: false, results, error: String(error) };
} finally {
  document.querySelector('#report').textContent = JSON.stringify(window.result, null, 2);
  acc.dispose(); renderer.dispose();
}
</script>
