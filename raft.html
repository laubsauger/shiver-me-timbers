<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071923" />
    <title>Raft 2100</title>
    <link rel="icon" type="image/png" href="/assets/branding/favicon.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a1a24;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #app canvas {
        display: block;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        color: #f3dfaa;
        background: linear-gradient(180deg, #0b2b38 0%, #071923 64%, #030c12 100%);
        opacity: 1;
        visibility: visible;
        transition: opacity 650ms ease, visibility 650ms step-end;
      }
      #boot-splash.boot-splash--ready {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-splash__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        font-family: Georgia, 'Times New Roman', serif;
      }
      .boot-splash__title {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #f6e7b9;
        text-shadow: 0 0.18rem 0 #6e4b1f, 0 0.45rem 1rem rgba(0, 0, 0, 0.8);
      }
      .boot-splash__kicker {
        margin: 1rem 0 0;
        color: #d4a94f;
        font: 700 0.72rem/1.2 system-ui, sans-serif;
        letter-spacing: 0.42em;
        text-transform: uppercase;
      }
      .boot-splash__loader {
        --boot-progress: 0.06;
        width: min(14rem, 58vw);
        height: 0.28rem;
        margin-top: 1.5rem;
        border: 1px solid rgba(181, 132, 53, 0.6);
        background: rgba(3, 17, 22, 0.76);
      }
      .boot-splash__loader::before {
        content: '';
        display: block;
        height: 100%;
        background: linear-gradient(180deg, #56b9ae 0%, #247d7a 48%, #123f47 100%);
        transform: scaleX(var(--boot-progress));
        transform-origin: left center;
        transition: transform 700ms cubic-bezier(0.22, 0.7, 0.2, 1);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Loading Raft 2100">
      <div class="boot-splash__content">
        <h1 class="boot-splash__title">Raft 2100</h1>
        <p class="boot-splash__kicker">Lashing the logs</p>
        <div class="boot-splash__loader" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="6"></div>
      </div>
    </div>
    <script>
      (() => {
        const splash = document.getElementById('boot-splash');
        if (!splash) throw new Error('missing boot splash root');
        const loader = splash.querySelector('.boot-splash__loader');
        const kicker = splash.querySelector('.boot-splash__kicker');
        let done = false;
        const dismiss = () => {
          if (done) return;
          done = true;
          if (loader) loader.style.setProperty('--boot-progress', '1');
          splash.classList.add('boot-splash--ready');
          splash.addEventListener('transitionend', () => splash.remove(), { once: true });
          setTimeout(() => splash.remove(), 2000);
        };
        // main-raft.ts calls this after the first presented frame, as main.ts does
        window.__bootReady = dismiss;
        const LABELS = {
          renderer: ['Waking the device', 0.16],
          'scene build': ['Raising the sea', 0.38],
          'shader compile': ['Compiling shaders', 0.68],
          'first frame': ['Casting off', 0.9],
        };
        window.__bootProgress = (phase) => {
          const l = LABELS[phase];
          if (!l) return;
          if (kicker) kicker.textContent = l[0];
          if (loader) {
            loader.style.setProperty('--boot-progress', String(l[1]));
            loader.setAttribute('aria-valuenow', String(Math.round(l[1] * 100)));
          }
        };
        // failsafe — never trap the user behind the splash
        setTimeout(dismiss, 30000);
      })();
    </script>
    <script type="module" src="/src/main-raft.ts"></script>
  </body>
</html>
