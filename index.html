<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071923" />
    <title>Shiver Me Timbers</title>
    <link rel="icon" type="image/png" href="/assets/branding/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/branding/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a1a24;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #app canvas {
        display: block;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #f3dfaa;
        background:
          radial-gradient(circle at 50% 38%, rgba(30, 117, 126, 0.32), transparent 30rem),
          linear-gradient(180deg, #0b2b38 0%, #071923 64%, #030c12 100%);
        opacity: 1;
        visibility: visible;
        transition: opacity 650ms ease, visibility 650ms step-end;
      }
      .boot-splash__seascape {
        position: absolute;
        inset: -2%;
        background: url('/assets/branding/loading-seascape.jpg') center bottom / cover no-repeat;
        opacity: 0.92;
        pointer-events: none;
        transform: scale(1.025) translate3d(-0.3%, 0.4%, 0);
        animation: boot-seascape-drift 14s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      #boot-splash.boot-splash--ready {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-splash__content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(88vw, 38rem);
        padding: 2rem;
        text-align: center;
      }
      .boot-splash__mark {
        width: clamp(12rem, 34vw, 20rem);
        height: auto;
        filter: drop-shadow(0 1.4rem 1.6rem rgba(0, 0, 0, 0.42));
        animation: boot-float 3.5s ease-in-out infinite;
      }
      .boot-splash__title {
        margin: -0.25rem 0 0;
        color: #f6e7b9;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(2.15rem, 7vw, 4.7rem);
        font-weight: 700;
        line-height: 0.92;
        letter-spacing: -0.045em;
        text-shadow: 0 0.18rem 0 #6e4b1f, 0 0.45rem 1rem rgba(0, 0, 0, 0.8);
      }
      .boot-splash__kicker {
        margin: 1rem 0 0;
        color: #d4a94f;
        font: 700 0.72rem/1.2 system-ui, sans-serif;
        letter-spacing: 0.42em;
        text-transform: uppercase;
      }
      .boot-splash__loader {
        width: min(13rem, 55vw);
        height: 0.18rem;
        margin-top: 2rem;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(243, 223, 170, 0.14);
      }
      .boot-splash__loader::after {
        content: '';
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #2ab3b4, #e3ba61, transparent);
        animation: boot-load 1.4s ease-in-out infinite;
      }
      .boot-splash__status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @keyframes boot-float {
        0%, 100% { transform: translateY(0) rotate(-0.4deg); }
        50% { transform: translateY(-0.55rem) rotate(0.4deg); }
      }
      @keyframes boot-seascape-drift {
        0% { transform: scale(1.025) translate3d(-0.3%, 0.4%, 0); }
        43% { transform: scale(1.035) translate3d(0.15%, -0.2%, 0); }
        100% { transform: scale(1.045) translate3d(0.4%, -0.55%, 0); }
      }
      @keyframes boot-load {
        from { transform: translateX(-110%); }
        to { transform: translateX(340%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__mark,
        .boot-splash__loader::after,
        .boot-splash__seascape {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Loading Shiver Me Timbers">
      <div class="boot-splash__seascape" aria-hidden="true"></div>
      <div class="boot-splash__content">
        <img
          class="boot-splash__mark"
          src="/assets/branding/shiver-me-timbers-splash.png"
          alt=""
          width="640"
          height="640"
        />
        <h1 class="boot-splash__title">Shiver Me Timbers</h1>
        <p class="boot-splash__kicker">All hands on deck</p>
        <div class="boot-splash__loader" aria-hidden="true"></div>
        <span class="boot-splash__status">Preparing the ship</span>
      </div>
    </div>
    <script>
      (() => {
        const root = document.getElementById('app');
        const splash = document.getElementById('boot-splash');
        if (!root || !splash) throw new Error('missing boot splash roots');

        const observer = new MutationObserver(() => {
          if (root.childElementCount === 0) return;
          observer.disconnect();
          splash.classList.add('boot-splash--ready');
          splash.addEventListener('transitionend', () => splash.remove(), { once: true });
        });
        observer.observe(root, { childList: true });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
